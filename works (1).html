<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Works — Yusuke Moriwaki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0c0b;
    --fg: #ece8e1;
    --fg-dim: #8c8880;
    --line: #2a2a27;
    --accent: #b08d57;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  header{
    position: fixed;
    top:0; left:0; right:0;
    z-index: 50;
    display:flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 6vw;
    mix-blend-mode: difference;
  }
  .logo{
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    letter-spacing: 0.08em;
    color: #fff;
    text-decoration: none;
  }
  nav{ display:flex; gap: 36px; }
  nav a{
    color:#fff;
    text-decoration:none;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.75;
    transition: opacity .3s ease;
  }
  nav a.current, nav a:hover, nav a:focus-visible{ opacity: 1; }

  .page-head{
    padding: 22vh 6vw 6vh;
  }
  .page-head .eyebrow{
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--fg-dim);
    text-transform: uppercase;
  }
  .page-head h1{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(2rem, 5vw, 3.2rem);
    margin: 10px 0 0;
    color: var(--fg);
  }

  .gallery{
    padding: 4vh 6vw 0;
    display: flex;
    flex-direction: column;
    gap: 12vh;
  }
  .frame{
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .frame.wide{ align-items: center; }
  .frame.wide img{ max-width: 78%; }
  .frame.left img{ margin-right: auto; }
  .frame.right img{ margin-left: auto; }
  .frame img{
    display:block;
    width: 60%;
    max-width: 680px;
    height: auto;
    filter: grayscale(12%) contrast(1.02);
    opacity: 0;
    transform: translateY(28px);
    transition: opacity .9s ease, transform .9s ease;
  }
  .frame.visible img{ opacity: 1; transform: translateY(0); }

  .frame-meta{
    display:flex;
    justify-content: space-between;
    width: 60%;
    max-width: 680px;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    color: var(--fg-dim);
    opacity: 0;
    transition: opacity 1s ease .2s;
  }
  .frame.visible .frame-meta{ opacity: 1; }
  .frame.wide .frame-meta{ width: 78%; }

  /* セクション区切り(見出しなし、細い線と通し番号レンジのみ) */
  .divider{
    display:flex;
    align-items:center;
    gap: 20px;
    margin: 4vh 0;
    opacity: .55;
  }
  .divider .rule{ flex:1; height:1px; background: var(--line); }
  .divider span{
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--fg-dim);
  }

  @media (max-width: 720px){
    .frame img, .frame-meta, .frame.wide img, .frame.wide .frame-meta{ width: 100%; max-width: none; }
    header{ padding: 22px 6vw; }
    nav{ gap: 20px; }
    .page-head{ padding: 16vh 6vw 5vh; }
  }

  footer{
    margin-top: 22vh;
    padding: 64px 6vw 48px;
    border-top: 1px solid var(--line);
    display:flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 24px;
  }
  footer .name{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.4rem;
    color: var(--fg);
  }
  footer .meta{
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: var(--fg-dim);
    text-transform: uppercase;
  }
  footer a{ color: var(--fg-dim); text-decoration: none; border-bottom: 1px solid transparent; }
  footer a:hover{ color: var(--fg); border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <a class="logo" href="#">Yusuke Moriwaki</a>
  <nav>
    <a class="current" href="#">Works</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<div class="page-head">
  <span class="eyebrow">FASHION — SELECTED WORKS</span>
  <h1>Works</h1>
</div>

<section class="gallery" id="gallery"></section>

<footer id="contact">
  <span class="name">Yusuke Moriwaki</span>
  <span class="meta"><a href="mailto:sky.fish.8869@gmail.com">sky.fish.8869@gmail.com</a> &nbsp;/&nbsp; Tokyo</span>
</footer>

<script>
  // 仮の写真データ(実運用ではNetlify CMSが生成するJSON/フロントマターに置き換え)
  const SOURCE = [
    "a74546_73de8a1e16734082a10d134421e7a809","a74546_df2567bc239c4583bcbfbd995d81d94a",
    "a74546_e05a11736fbe425bac592bf83c3b0756","a74546_528615bb466145a293b80a0e6710ee9b",
    "a74546_ab66fffd2f49458ab2e1dcf24ac5c46d","a74546_bf9d2ecbf4fb4594b3866fccd3b8689f",
    "a74546_768346ebbc6e4900be7bb7ec76bf51e6","a74546_0fe3cc8257434140b4ab954c2e2046b5",
    "a74546_7b151667067242b4b09c5abf6469c76b","a74546_bf73d7cd40af401b9491bfd3585f40e0",
    "a74546_5203a89a62614825a11dffcb736cca5a","a74546_5faf46871934409c8ba69cd41fe2d54d",
    "a74546_4b8c7a110b4e44f693e1151d7f226166","a74546_4f5c84b435e44124b5d6380cdccdc6dc",
    "a74546_55a52134e1cb4fe39254686a4e1435db","a74546_a0a6f782eb8943ec865271d51ffd67c0",
    "a74546_323afae5fc1346f58f0fbfb90954ff80","a74546_8f46f14bcea44bcc9b96d398c7c5e661",
    "a74546_4d5c161fc7b14f84bc2e38149cc0ea49","a74546_e9e353239f424150af9353fada39afe4",
    "a74546_741d0085acef4f308ef54268df905ebb","a74546_d83c5c0b477b42198e21a14c8b13859f",
    "a74546_13b364a65c744e479ce028e34101cf96","a74546_ead41409de0642349630df33f883ae55",
    "a74546_7abcc340efbd46129d1fa9632bfe6af4"
  ];

  const gallery = document.getElementById('gallery');
  const layouts = ['left','wide','right'];
  const SECTION_SIZE = 6; // 6枚ごとに区切りを挿入

  SOURCE.forEach((id, i) => {
    if(i > 0 && i % SECTION_SIZE === 0){
      const div = document.createElement('div');
      div.className = 'divider';
      const rangeStart = String(i+1).padStart(2,'0');
      const rangeEnd = String(Math.min(i+SECTION_SIZE, SOURCE.length)).padStart(2,'0');
      div.innerHTML = `<span>${rangeStart}–${rangeEnd}</span><div class="rule"></div>`;
      gallery.appendChild(div);
    }
    const frame = document.createElement('div');
    frame.className = 'frame ' + layouts[i % layouts.length];
    frame.innerHTML = `
      <img loading="lazy" src="https://static.wixstatic.com/media/${id}~mv2.jpg/v1/fill/w_500,h_650,q_90,enc_avif,quality_auto/${id}~mv2.jpg" alt="">
      <div class="frame-meta"><span>${String(i+1).padStart(2,'0')}</span><span>FASHION</span></div>
    `;
    gallery.appendChild(frame);
  });

  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.frame').forEach(f=>io.observe(f));
</script>

</body>
</html>
