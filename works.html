<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Works — Yusuke Moriwaki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0c0b;
    --fg: #ece8e1;
    --fg-dim: #8c8880;
    --line: #2a2a27;
    --accent: #b08d57;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  header{
    position: fixed;
    top:0; left:0; right:0;
    z-index: 50;
    display:flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 6vw;
    mix-blend-mode: difference;
  }
  .logo{
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    letter-spacing: 0.08em;
    color: #fff;
    text-decoration: none;
  }
  nav{ display:flex; gap: 36px; }
  nav a{
    color:#fff;
    text-decoration:none;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.75;
    transition: opacity .3s ease;
  }
  nav a.current, nav a:hover, nav a:focus-visible{ opacity: 1; }

  .page-head{
    padding: 22vh 6vw 6vh;
  }
  .page-head .eyebrow{
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--fg-dim);
    text-transform: uppercase;
  }
  .page-head h1{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(2rem, 5vw, 3.2rem);
    margin: 10px 0 0;
    color: var(--fg);
  }

  .gallery{
    padding: 4vh 6vw 0;
    display: flex;
    flex-direction: column;
    gap: 12vh;
  }
  .frame{
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .frame.wide{ align-items: center; }
  .frame.wide img{ max-width: 78%; }
  .frame.left img{ margin-right: auto; }
  .frame.right img{ margin-left: auto; }
  .frame img{
    display:block;
    width: 60%;
    max-width: 680px;
    height: auto;
    filter: grayscale(12%) contrast(1.02);
    opacity: 0;
    transform: translateY(28px);
    transition: opacity .9s ease, transform .9s ease;
  }
  .frame.visible img{ opacity: 1; transform: translateY(0); }

  .frame-meta{
    display:flex;
    justify-content: space-between;
    width: 60%;
    max-width: 680px;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    color: var(--fg-dim);
    opacity: 0;
    transition: opacity 1s ease .2s;
  }
  .frame.visible .frame-meta{ opacity: 1; }
  .frame.wide .frame-meta{ width: 78%; }

  /* セクション区切り(見出しなし、細い線と通し番号レンジのみ) */
  .divider{
    display:flex;
    align-items:center;
    gap: 20px;
    margin: 4vh 0;
    opacity: .55;
  }
  .divider .rule{ flex:1; height:1px; background: var(--line); }
  .divider span{
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--fg-dim);
  }

  @media (max-width: 720px){
    .frame img, .frame-meta, .frame.wide img, .frame.wide .frame-meta{ width: 100%; max-width: none; }
    header{ padding: 22px 6vw; }
    nav{ gap: 20px; }
    .page-head{ padding: 16vh 6vw 5vh; }
  }

  footer{
    margin-top: 22vh;
    padding: 64px 6vw 48px;
    border-top: 1px solid var(--line);
    display:flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 24px;
  }
  footer .name{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.4rem;
    color: var(--fg);
  }
  footer .meta{
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: var(--fg-dim);
    text-transform: uppercase;
  }
  footer a{ color: var(--fg-dim); text-decoration: none; border-bottom: 1px solid transparent; }
  footer a:hover{ color: var(--fg); border-color: var(--accent); }
</style>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

<header>
  <a class="logo" href="#">Yusuke Moriwaki</a>
  <nav>
    <a class="current" href="#">Works</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<div class="page-head">
  <span class="eyebrow">FASHION — SELECTED WORKS</span>
  <h1>Works</h1>
</div>

<section class="gallery" id="gallery"></section>

<footer id="contact">
  <span class="name">Yusuke Moriwaki</span>
  <span class="meta"><a href="mailto:sky.fish.8869@gmail.com">sky.fish.8869@gmail.com</a> &nbsp;/&nbsp; Tokyo</span>
</footer>

<script>
  // Netlify CMSが更新する content/works.json から写真を読み込む
  fetch('/content/works.json')
    .then(res => res.json())
    .then(data => {
      const SOURCE = data.photos.map(p => p.image);

      const gallery = document.getElementById('gallery');
      const layouts = ['left','wide','right'];
      const SECTION_SIZE = 6; // 6枚ごとに区切りを挿入

      SOURCE.forEach((imgUrl, i) => {
        if(i > 0 && i % SECTION_SIZE === 0){
          const div = document.createElement('div');
          div.className = 'divider';
          const rangeStart = String(i+1).padStart(2,'0');
          const rangeEnd = String(Math.min(i+SECTION_SIZE, SOURCE.length)).padStart(2,'0');
          div.innerHTML = `<span>${rangeStart}–${rangeEnd}</span><div class="rule"></div>`;
          gallery.appendChild(div);
        }
        const frame = document.createElement('div');
        frame.className = 'frame ' + layouts[i % layouts.length];
        frame.innerHTML = `
          <img loading="lazy" src="${imgUrl}" alt="">
          <div class="frame-meta"><span>${String(i+1).padStart(2,'0')}</span><span>FASHION</span></div>
        `;
        gallery.appendChild(frame);
      });

      const io = new IntersectionObserver((entries)=>{
        entries.forEach(e=>{
          if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); }
        });
      }, { threshold: 0.15 });
      document.querySelectorAll('.frame').forEach(f=>io.observe(f));
    });
</script>

</body>
</html>
